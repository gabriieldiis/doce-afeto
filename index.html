<script>
    document.addEventListener('DOMContentLoaded', () => {

        // ===== CARROSSEL PRINCIPAL =====
        const carrousel = document.querySelector('.hathome-carrousel');

        if (carrousel) {
            const list = carrousel.querySelector('.splide__list');

            if (list) {
                const allSlides = Array.from(list.children);
                const fixedFirst = allSlides.filter(slide => slide.hasAttribute('data-fixed-first'));
                const fixedLast = allSlides.filter(slide => slide.hasAttribute('data-fixed-last'));
                const slides = allSlides.filter(slide =>
                    !slide.hasAttribute('data-fixed-first') && !slide.hasAttribute('data-fixed-last'));

                // Embaralha os demais banners.
                for (let i = slides.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [slides[i], slides[j]] = [slides[j], slides[i]];
                }

                // data-fixed-first sempre no início; data-fixed-last sempre no final.
                const ordered = [...fixedFirst, ...slides, ...fixedLast];
                ordered.forEach(slide => list.appendChild(slide));

                ordered.forEach((slide, index) => {
                    const img = slide.querySelector('img');
                    if (!img) return;

                    img.removeAttribute('loading');
                    img.removeAttribute('fetchpriority');

                    if (index === 0) {
                        img.setAttribute('loading', 'eager');
                        img.setAttribute('fetchpriority', 'high');
                    } else {
                        img.setAttribute('loading', 'lazy');
                        img.setAttribute('fetchpriority', 'low');
                    }
                });
            }

            new Splide(carrousel, {
                type: 'loop',
                pagination: false,
                autoplay: true,
                pauseOnHover: false,
                speed: 1000,
                interval: 4000
            }).mount();
        }

        // ===== INFOS =====
        const infos = document.querySelector('.hathome-infos');

        if (infos) {
            new Splide(infos, {
                arrows: false,
                pagination: false,
                autoplay: true,
                interval: 5000,
                speed: 800,
                perPage: 5,
                gap: 10,

                breakpoints: {
                    768: { perPage: 1, drag: true },
                    1024: { perPage: 3, drag: false },
                    1280: { perPage: 4, drag: false },
                    1468: { perPage: 4, drag: false }
                }
            }).mount();
        }

        // ===== TRACKING =====
        const runTracking = () => {
            if (typeof ObterDataLayerPromotionImpressionHomePorCodigosProduto === 'function') {
                ObterDataLayerPromotionImpressionHomePorCodigosProduto(
                    ['996102', '671993', '998374', '999232'],
                    {
                        promocoes: [
                            { id: '20250220_mouseergo', nome: 'Notebook Asus E510MA...' },
                            { id: '20230331_genericos', nome: 'Monitor 23,8pol...' }
                        ]
                    }
                );
            }
        };

        if ('requestIdleCallback' in window) {
            requestIdleCallback(runTracking);
        } else {
            setTimeout(runTracking, 200);
        }

    });

    // ===== VITRINES NO MOBILE: SCROLL NATIVO =====
    // O arrasto do Splide briga com o CSS do site no celular (card de 172px,
    // mas o carrossel anda 359px por vez). Aqui o Splide deixa de receber o toque
    // e a vitrine usa o scroll nativo com encaixe. Desktop não muda.
    // As vitrines da home carregam aos poucos, conforme o usuário rola a página,
    // então um MutationObserver aplica a função em cada vitrine nova que aparecer.
    (function () {
        const mq = window.matchMedia('(max-width: 767.98px)');
        const bloqueia = e => { if (mq.matches) e.stopPropagation(); };

        const aplicar = (raiz) => {
            (raiz || document).querySelectorAll('.products_home:not(.vitrine-nativa)').forEach(sp => {
                sp.classList.add('vitrine-nativa');
                ['touchstart', 'mousedown', 'pointerdown'].forEach(t =>
                    sp.addEventListener(t, bloqueia, true));
            });
        };

        const iniciar = () => {
            aplicar();

            new MutationObserver(mutacoes => {
                for (const m of mutacoes) {
                    for (const n of m.addedNodes) {
                        if (n.nodeType !== 1) continue;
                        if (n.matches('.products_home') || n.querySelector('.products_home')) {
                            aplicar(n.parentNode || n);
                        }
                    }
                }
            }).observe(document.body, { childList: true, subtree: true });
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', iniciar);
        } else {
            iniciar();
        }
        window.addEventListener('load', () => aplicar()); // garantia extra
    })();
</script>
